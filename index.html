<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사용자공임 산출 계산기(M/H적용)</title>
<style>
  :root{
    --ink:#1c2b26;
    --paper:#f6f4ee;
    --line:#c9c2b2;
    --accent:#2f5d50;
    --accent-soft:#dde7e2;
    --num:#3d3226;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Noto Serif KR', Georgia, serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    line-height:1.5;
    padding:40px 20px 80px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    color:var(--ink);
  }
  .sub{
    color:#6b6255;
    font-size:14px;
    margin:0 0 36px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
  }
  .card{
    background:#fffdf9;
    border:1px solid var(--line);
    border-radius:2px;
    padding:24px 26px;
    margin-bottom:22px;
    position:relative;
  }
  .card::before{
    content:attr(data-step);
    position:absolute;
    top:0;
    left:0;
    font-family:var(--mono);
    font-size:11px;
    color:#fff;
    background:var(--accent);
    padding:3px 10px;
    letter-spacing:0.04em;
  }
  .card h2{
    font-size:15px;
    font-weight:700;
    margin:6px 0 18px;
    color:var(--accent);
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .row label{
    flex:0 0 92px;
    font-size:13px;
    color:#6b6255;
  }
  .field{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
  }
  input[type=text]{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:2px;
    padding:9px 40px 9px 12px;
    font-family:var(--mono);
    font-size:14px;
    color:var(--num);
    text-align:right;
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .unit{
    position:absolute;
    right:12px;
    font-size:12px;
    color:#a39c8c;
    pointer-events:none;
  }
  .result-inline{
    background:var(--accent-soft);
    border-radius:2px;
    padding:10px 12px;
    margin-top:14px;
    font-size:13px;
    color:var(--accent);
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
  }
  .time-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:12px;
  }
  .time-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .time-row input{
    flex:1;
  }
  .time-row button{
    flex:0 0 auto;
    border:none;
    background:none;
    color:#a39c8c;
    font-size:16px;
    cursor:pointer;
    padding:4px 8px;
  }
  .time-row button:hover{color:#b5453b;}
  .add-time{
    border:1px dashed var(--line);
    background:none;
    color:var(--accent);
    font-size:13px;
    padding:8px;
    width:100%;
    border-radius:2px;
    cursor:pointer;
    margin-bottom:6px;
  }
  .add-time:hover{background:var(--accent-soft);}

  .final{
    background:var(--ink);
    color:var(--paper);
    border-radius:2px;
    padding:30px 26px;
    text-align:center;
  }
  .final .label{
    font-size:12px;
    letter-spacing:0.04em;
    color:#a9c2b8;
    margin-bottom:8px;
  }
  .final .value{
    font-family:var(--serif);
    font-size:42px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .breakdown{
    margin-top:22px;
    border-top:1px solid #3a493f;
    padding-top:16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 20px;
    font-family:var(--mono);
    font-size:12.5px;
    color:#c9d6cd;
    text-align:left;
  }
  .breakdown div span{
    display:block;
    color:#7f9187;
    font-size:11px;
    margin-bottom:2px;
  }
  @media (max-width:480px){
    .breakdown{grid-template-columns:1fr;}
    .final .value{font-size:34px;}
    .row{flex-wrap:wrap;}
    .row label{flex-basis:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>사용자공임 산출 계산기</h1>
  <p class="sub">M/H(시간당 공임단가)를 적용해 사용자공임 최종 금액을 계산합니다</p>

  <div class="card" data-step="STEP 1">
    <h2>M/H 계산 — 시간당 공임단가</h2>
    <div class="row">
      <label>공임금액</label>
      <div class="field">
        <input type="text" id="baseAmount" value="61,210" inputmode="numeric">
        <span class="unit">원</span>
      </div>
    </div>
    <div class="row">
      <label>시간</label>
      <div class="field">
        <input type="text" id="baseHour" value="1.580" inputmode="decimal">
        <span class="unit">H</span>
      </div>
    </div>
    <div class="result-inline">
      <span>H단가 = 공임금액 ÷ 시간</span>
      <span id="hRateOut">38,741원 / H</span>
    </div>
  </div>

  <div class="card" data-step="STEP 2">
    <h2>최종 결과값 계산</h2>
    <div class="row">
      <label>기준금액</label>
      <div class="field">
        <input type="text" id="refAmount" value="56,200" inputmode="numeric">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="row" style="align-items:flex-start;">
      <label style="margin-top:9px;">시간(H)</label>
      <div style="flex:1;">
        <div class="time-list" id="timeList"></div>
        <button class="add-time" id="addTime">+ 시간 추가</button>
      </div>
    </div>

    <div class="row">
      <label>적용율</label>
      <div class="field">
        <input type="text" id="rate" value="65" inputmode="decimal">
        <span class="unit">%</span>
      </div>
    </div>
  </div>

  <div class="final">
    <div class="label">최종 결과값</div>
    <div class="value" id="finalOut">0원</div>
    <div class="breakdown">
      <div><span>H단가</span><b id="bH">-</b></div>
      <div><span>총 H</span><b id="bTotalH">-</b></div>
      <div><span>공임합계</span><b id="bSum">-</b></div>
      <div><span>적용율</span><b id="bRate">-</b></div>
    </div>
  </div>
</div>

<script>
function toNum(str){
  if(!str) return 0;
  const n = parseFloat(String(str).replace(/,/g,'').trim());
  return isNaN(n) ? 0 : n;
}
function fmtWon(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}
function fmtNum(n, digits){
  return n.toLocaleString('ko-KR', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}

const timeListEl = document.getElementById('timeList');
let timeValues = ['1.55','0.5'];

function renderTimeRows(){
  timeListEl.innerHTML = '';
  timeValues.forEach((val, idx) => {
    const row = document.createElement('div');
    row.className = 'time-row';
    row.innerHTML = `
      <input type="text" inputmode="decimal" value="${val}" data-idx="${idx}">
      <span style="font-size:12px;color:#a39c8c;">H</span>
      <button data-remove="${idx}" title="삭제">×</button>
    `;
    timeListEl.appendChild(row);
  });
  timeListEl.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.idx;
      timeValues[i] = e.target.value;
      calculate();
    });
  });
  timeListEl.querySelectorAll('button[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = +e.target.dataset.remove;
      if(timeValues.length > 1){
        timeValues.splice(i,1);
        renderTimeRows();
        calculate();
      }
    });
  });
}

document.getElementById('addTime').addEventListener('click', ()=>{
  timeValues.push('0');
  renderTimeRows();
  calculate();
});

function calculate(){
  const baseAmount = toNum(document.getElementById('baseAmount').value);
  const baseHour = toNum(document.getElementById('baseHour').value);
  const hRate = baseHour > 0 ? Math.round(baseAmount / baseHour) : 0;
  document.getElementById('hRateOut').textContent = fmtWon(hRate) + ' / H';

  const refAmount = toNum(document.getElementById('refAmount').value);
  const totalH = timeValues.reduce((sum, v) => sum + toNum(v), 0);
  const rate = toNum(document.getElementById('rate').value);

  const sum = Math.round(refAmount + (totalH * hRate));
  const final = sum * (rate / 100);

  document.getElementById('finalOut').textContent = fmtWon(final);
  document.getElementById('bH').textContent = fmtWon(hRate) + '/H';
  document.getElementById('bTotalH').textContent = fmtNum(totalH,2) + 'H';
  document.getElementById('bSum').textContent = fmtWon(sum);
  document.getElementById('bRate').textContent = fmtNum(rate,0) + '%';
}

['baseAmount','baseHour','refAmount','rate'].forEach(id=>{
  document.getElementById(id).addEventListener('input', calculate);
});

renderTimeRows();
calculate();
</script>
</body>
</html>
